---
services:
  tunnel-ssh:
    image: {{ tacet://*/umbilical.deploy.cloudpublic_registry_host/password }}/umbilical/tunnel:latest
    environment:
      TZ: "{{ tacet://*/umbilical.deploy.timezone/password }}"
    volumes:
      - ./tunnel-ssh/ssh:/tmp/ssh
      - ./tunnel-ssh/entrypoint.sh:/entrypoint.sh
    command: ["sh", "/entrypoint.sh"]
    restart: always

  shutdown:
    image: {{ tacet://*/umbilical.deploy.cloudpublic_registry_host/password }}/umbilical/shutdown:latest
    privileged: true
    network_mode: host # exposed port 37901
    environment:
      TZ: "{{ tacet://*/umbilical.deploy.timezone/password }}"
      TERM: "xterm-256color"
      GOTTY_PORT: "37901"
      GOTTY_WS_ORIGIN: ".*"
    volumes:
      - /bin/systemctl:/bin/systemctl
      - /run/systemd/system:/run/systemd/system
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /sys/fs/cgroup:/sys/fs/cgroup
    restart: unless-stopped
