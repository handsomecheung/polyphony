---
# not use bridge mode at all because of the NetworkManager DNS issue in raspberrypi 64 bit OS
services:
  tunnel-ssh:
    image: {{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/cloudpublic-registry-host }}/umbilical/tunnel:latest
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/timezone }}"
    volumes:
      - ./tunnel-ssh/ssh:/root/.ssh
      - ./tunnel-ssh/entrypoint.sh:/entrypoint.sh
    command: ["sh", "/entrypoint.sh"]
    network_mode: host
    restart: always

  tunnel:
    image: {{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/cloudpublic-registry-host }}/umbilical/tunnel:latest
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/timezone }}"
    volumes:
      - ./tunnel/ssh:/root/.ssh
      - ./tunnel/entrypoint.sh:/entrypoint.sh
    command: ["sh", "/entrypoint.sh"]
    network_mode: host
    restart: unless-stopped

  ipset-watcher:
    image: {{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/cloudpublic-registry-host }}/umbilical/ipset-watcher:latest
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/timezone }}"
    privileged: true
    network_mode: host
    volumes:
      - ./ipset-watcher:/code
      - /var/log/ipset-watcher:/var/log/ipset-watcher
    working_dir: /code
    command: ["bash", "run.sh"]
    restart: unless-stopped

  ddns:
    image: {{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/cloudpublic-registry-host }}/umbilical/ddns:latest
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/timezone }}"
      DOMAIN: "{{ tacet://org/Default/DevOps/Base/infra-domains/u }}"
      ALIYUN_ACCESSKEY_ID: "{{ tacet://org/Default/DevOps/Umbilical/aliyun.dns-update.key/id }}"
      ALIYUN_ACCESSKEY_SECRET: "{{ tacet://org/Default/DevOps/Umbilical/aliyun.dns-update.key/secret }}"
    volumes:
      - ./ddns:/code
    network_mode: host
    working_dir: /code
    command: ["python3", "-u", "main.py"]
    restart: unless-stopped

  wakeup:
    image: {{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/cloudpublic-registry-host }}/umbilical/wakeup:latest
    privileged: true
    network_mode: host
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/timezone }}"
      GOTTY_WS_ORIGIN: ".*"
      TERM: "xterm-256color"
      GOTTY_PORT: "37902"
      MAC_SILVER: "{{ tacet://org/Default/DevOps/Umbilical/infra.machine.silver/mac }}"
      UMBILICAL_IPV4_PREFIX: "{{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/subnetv4 }}."
    restart: unless-stopped

  sing-box:
    image: {{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/cloudpublic-registry-host }}/umbilical/sing-box:latest
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/timezone }}"
    privileged: true
    network_mode: host
    volumes:
      - ./sing-box/configs:/etc/sing-box
      - ./sing-box/rule-sets:/etc/sing-box/rule-sets
    restart: unless-stopped
    command: ["run", "-C", "/etc/sing-box"]
    cap_add:
      - NET_ADMIN
      - NET_RAW

  vouch:
    image: {{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/cloudpublic-registry-host }}/umbilical/vouch:latest-arm
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/timezone }}"
    volumes:
      - ./vouch/config:/config
    network_mode: host
    restart: unless-stopped

  nginx:
    depends_on:
      - vouch
    image: {{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/cloudpublic-registry-host }}/umbilical/openresty:latest
    command: ["nginx", "-g", "daemon off;"]
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/timezone }}"
    volumes:
      - ../../../static/letsencrypt:/etc/letsencrypt
      - ./nginx/configs/index:/usr/share/nginx/index
      - ./nginx/configs/nginx.conf:/etc/openresty/nginx.conf
      - ./nginx/configs/conf:/etc/openresty/conf
      - ./nginx/configs/lua:/usr/local/openresty/nginx/lua
    network_mode: host
    restart: unless-stopped
