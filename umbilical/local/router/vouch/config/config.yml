---
vouch:
  # testing: true  # This will slow down the loop.
  # logLevel: debug

  domains:
    - {{ tacet://org/Default/DevOps/Base/infra-domains/u }}

  whiteList:
    - {{ tacet://org/Default/DevOps/Base/infra-emails/hh }}
    - {{ tacet://org/Default/DevOps/Base/infra-emails/hz }}

  cookie:
    # allow the jwt/cookie to be set into http://yourdomain.com (defaults to true, requiring https://yourdomain.com)
    secure: true
    # Number of minutes until session cookie expires - VOUCH_COOKIE_MAXAGE
    # Set cookie maxAge to 0 to delete the cookie every time the browser is closed.
    # Must not be longer than jwt.maxAge
    maxAge: 10080 # 60 * 24 * 7

oauth:
  provider: google
  # get credentials from...
  # https://console.developers.google.com/apis/credentials
  client_id: {{ tacet://org/Default/DevOps/Umbilical/umbilical.vouch.oauth.key/id }}
  client_secret: {{ tacet://org/Default/DevOps/Umbilical/umbilical.vouch.oauth.key/secret }}
  # Google may require callback_urls (redirect URIs) to be 'https'
  callback_urls:
    - https://vouch.{{ tacet://org/Default/DevOps/Base/infra-domains/u }}/auth
  # preferredDomain: yourdomain.com  # be careful with this option, it may conflict with chrome on Android
  # endpoints are set from https://godoc.org/golang.org/x/oauth2/google
