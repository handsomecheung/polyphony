---
version: "3"
services:
  nginx:
    image: {{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/cloudpublic-registry-host }}/umbilical/nginx:latest
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/timezone }}"
    volumes:
      - /var/log/umbilical/nginx:/var/log/nginx
      - ../../static/letsencrypt:/etc/letsencrypt
      - ./nginx/configs/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/configs/robots.conf:/etc/nginx/robots.conf
    ports:
      - 25443:443
    restart: unless-stopped

  wireguard:
    image: {{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/cloudpublic-registry-host }}/umbilical/wireguard:latest
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Umbilical/Base/infra-infos/timezone }}"
      WG_HOST: "wireguard.{{ tacet://org/Default/DevOps/Base/infra-domains/u }}"
      PASSWORD_HASH: "{{ tacet://org/Default/DevOps/Umbilical/umbilical.wireguard/hash }}"
      PORT: "51821"
      WG_PORT: "51820"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    volumes:
      - /root/wireguard:/etc/wireguard
    ports:
      - 51820:51820/udp
    restart: unless-stopped
