---
- hosts: localhost
  vars:
    home_dir: "{{ ansible_facts.env.HOME }}"
    cache_dir: /mnt/coder-workspaces/public-workspace/cache
    repos_dir: /mnt/coder-workspaces/private-workspace/repos/local/polyphony/devconfigs/repos
    configs_dir: /mnt/coder-workspaces/private-workspace/repos/local/polyphony/devconfigs/configs
    scripts_dir: /mnt/coder-workspaces/private-workspace/repos/local/polyphony/devconfigs/scripts
  tasks:
    - name: Ensure directories exist
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ home_dir }}/.config"
        - "{{ home_dir }}/.local/share"
        - "{{ home_dir }}/scripts/"

    - file:
        src: "{{ configs_dir }}/ctags/.ctags"
        dest: "{{ home_dir }}/.ctags"
        state: link
    - file:
        src: "{{ configs_dir }}/yamllint"
        dest: "{{ home_dir }}/.config/yamllint"
        state: link
    - file:
        src: "{{ configs_dir }}/golangci/.golangci.yml"
        dest: "{{ home_dir }}/.golangci.yml"
        state: link
    - file:
        src: "{{ configs_dir }}/flake8/flake8"
        dest: "{{ home_dir }}/.flake8"
        state: link
    - file:
        src: "{{ configs_dir }}/flake8/flake8"
        dest: "{{ home_dir }}/.flake8rc"
        state: link
    - file:
        src: "{{ configs_dir }}/eslint/eslintrc.js"
        dest: "{{ home_dir }}/.eslintrc.js"
        state: link
    - file:
        src: "{{ configs_dir }}/rubocop/.rubocop.yml"
        dest: "{{ home_dir }}/.rubocop.yml"
        state: link
    - file:
        src: "{{ configs_dir }}/pylint/.pylintrc"
        dest: "{{ home_dir }}/.pylintrc"
        state: link
    - file:
        src: "{{ configs_dir }}/zsh/zlogin"
        dest: "{{ home_dir }}/.zlogin"
        state: link
    - file:
        src: "{{ configs_dir }}/zsh/zshrc"
        dest: "{{ home_dir }}/.zshrc"
        state: link
    - file:
        src: "{{ configs_dir }}/zsh/p10k.zsh"
        dest: "{{ home_dir }}/.p10k.zsh"
        state: link
    - file:
        src: "{{ configs_dir }}/bash/.bashrc"
        dest: "{{ home_dir }}/.bashrc"
        state: link
        force: yes

    - file:
        src: "{{ configs_dir }}/zoxide"
        dest: "{{ home_dir }}/.local/share/zoxide"
        state: link
    - file:
        src: "{{ configs_dir }}/lazygit"
        dest: "{{ home_dir }}/.config/lazygit"
        state: link
    - file:
        src: "{{ configs_dir }}/vim/.vim"
        dest: "{{ home_dir }}/.vim"
        state: link
    - file:
        src: "{{ configs_dir }}/vim/.vim_config"
        dest: "{{ home_dir }}/.vim_config"
        state: link
    - file:
        src: "{{ configs_dir }}/vim/.vimrc"
        dest: "{{ home_dir }}/.vimrc"
        state: link
    - file:
        src: "{{ configs_dir }}/git/.gitconfig"
        dest: "{{ home_dir }}/.gitconfig"
        state: link
    - file:
        src: "{{ configs_dir }}/tmux"
        dest: "{{ home_dir }}/.config/tmux"
        state: link
    - file:
        src: "{{ configs_dir }}/htop"
        dest: "{{ home_dir }}/.config/htop"
        state: link
    - file:
        src: "{{ configs_dir }}/terminator"
        dest: "{{ home_dir }}/.config/terminator"
        state: link
    - file:
        src: "{{ configs_dir }}/gem/.gemrc"
        dest: "{{ home_dir }}/.gemrc"
        state: link
    - file:
        src: "{{ configs_dir }}/black/black"
        dest: "{{ home_dir }}/.config/black"
        state: link
    - file:
        src: "{{ configs_dir }}/powerline-shell"
        dest: "{{ home_dir }}/.config/powerline-shell"
        state: link
    - file:
        src: "{{ configs_dir }}/iterm2/iterm2_shell_integration.zsh"
        dest: "{{ home_dir }}/.iterm2_shell_integration.zsh"
        state: link
    - file:
        src: "{{ configs_dir }}/starship/starship.toml"
        dest: "{{ home_dir }}/.config/starship.toml"
        state: link

    - file:
        src: "{{ scripts_dir }}"
        dest: "{{ home_dir }}/scripts/dev"
        state: link

    - git:
        repo: "https://github.com/ohmyzsh/ohmyzsh.git"
        dest: "{{ repos_dir }}/oh-my-zsh"
        update: no
    - file:
        src: "{{ repos_dir }}/oh-my-zsh"
        dest: "{{ home_dir }}/.oh-my-zsh"
        state: link

    - file:
        src: "{{ configs_dir }}/npm/.npmrc"
        dest: "{{ home_dir }}/.npmrc"
        state: link

    - git:
        repo: "https://github.com/zsh-users/zsh-autosuggestions"
        dest: "{{ repos_dir }}/oh-my-zsh/custom/plugins/zsh-autosuggestions"
        update: no

    - git:
        repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
        dest: "{{ repos_dir }}/oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
        update: no

    - git:
        repo: "https://github.com/romkatv/powerlevel10k.git"
        dest: "{{ repos_dir }}/oh-my-zsh/custom/themes/powerlevel10k"
        update: no

    - file:
        path: "{{ repos_dir }}/oh-my-zsh/custom/completions"
        state: directory
    - name: Download kubectx completion
      command: curl -sLo "{{ repos_dir }}/oh-my-zsh/custom/completions/_kubectx.zsh" https://raw.githubusercontent.com/ahmetb/kubectx/master/completion/_kubectx.zsh
    - name: Download kubens completion
      command: curl -sLo "{{ repos_dir }}/oh-my-zsh/custom/completions/_kubens.zsh" https://raw.githubusercontent.com/ahmetb/kubectx/master/completion/_kubens.zsh

    - git:
        repo: "https://github.com/aftoul/ranger.git"
        version: dir_preview
        dest: "{{ repos_dir }}/ranger"
        update: no

    - git:
        repo: "https://github.com/asdf-vm/asdf.git"
        version: v0.14.0
        dest: "{{ repos_dir }}/asdf"
        update: no
    - name: Check if .asdf exists
      stat:
        path: "{{ home_dir }}/.asdf"
      register: asdf_dir
    - file:
        src: "{{ repos_dir }}/asdf"
        dest: "{{ home_dir }}/.asdf"
        state: link
      when: not asdf_dir.stat.exists

    - name: Check if home android dir exists
      stat:
        path: "{{ cache_dir }}/home.android"
      register: home_android_dir
    - file:
        src: "{{ cache_dir }}/home.android"
        dest: "{{ home_dir }}/.android"
        state: link
      when: home_android_dir.stat.exists

    - name: Check if home pubcache dir exists
      stat:
        path: "{{ cache_dir }}/home.pub-cache"
      register: home_pubcache_dir
    - file:
        src: "{{ cache_dir }}/home.pub-cache"
        dest: "{{ home_dir }}/.pub-cache"
        state: link
      when: home_pubcache_dir.stat.exists

    - name: Check if home gradle dir exists
      stat:
        path: "{{ cache_dir }}/home.gradle"
      register: home_gradle_dir
    - file:
        src: "{{ cache_dir }}/home.gradle"
        dest: "{{ home_dir }}/.gradle"
        state: link
      when: home_gradle_dir.stat.exists
