---
apiVersion: v1
kind: Secret
metadata:
  name: letsencrypt-refresh--aliyun-credentials
  namespace: default
type: Opaque
stringData:
  credentials.ini: |
    dns_aliyun_access_key = {{ tacet://org/Default/DevOps/Koishi/aliyun.letsencrypt-refresh.key/id }}
    dns_aliyun_access_key_secret = {{ tacet://org/Default/DevOps/Koishi/aliyun.letsencrypt-refresh.key/secret }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: letsencrypt-refresh-umbilical
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: nur
      volumes:
        - name: letsencrypt-etc
          hostPath:
            path: /mnt/coder-workspaces/private-workspace/repos/local/polyphony/koishi/letsencrypt-refresh/cache/etc
            type: DirectoryOrCreate
        - name: letsencrypt-var
          hostPath:
            path: /mnt/coder-workspaces/private-workspace/repos/local/polyphony/koishi/letsencrypt-refresh/cache/var
            type: DirectoryOrCreate
        - name: credentials
          secret:
            secretName: letsencrypt-refresh--aliyun-credentials
        - name: certs-output
          hostPath:
            path: /mnt/coder-workspaces/private-workspace/repos/local/polyphony/static/letsencrypt
            type: DirectoryOrCreate
      initContainers:
        - name: generate
          image: cloudpublic/default/dns-aliyun:latest
          args:
            - certonly
            - --non-interactive
            - --agree-tos
            - --email={{ tacet://org/Default/DevOps/Base/infra-emails/hh }}
            - --authenticator=dns-aliyun
            - --dns-aliyun-credentials=/credentials.ini
            - -d
            - "{{ tacet://org/Default/DevOps/Base/infra-domains/u }}"
            - -d
            - "*.{{ tacet://org/Default/DevOps/Base/infra-domains/u }}"
            - -d
            - "*.public.{{ tacet://org/Default/DevOps/Base/infra-domains/u }}"
            - -d
            - "*.silver.{{ tacet://org/Default/DevOps/Base/infra-domains/u }}"
            - -d
            - "*.direct.{{ tacet://org/Default/DevOps/Base/infra-domains/u }}"
            - -d
            - "*.j.{{ tacet://org/Default/DevOps/Base/infra-domains/u }}"
          volumeMounts:
            - name: letsencrypt-etc
              mountPath: /etc/letsencrypt
            - name: letsencrypt-var
              mountPath: /var/lib/letsencrypt
            - name: credentials
              mountPath: /credentials.ini
              subPath: credentials.ini
              readOnly: true

      containers:
        - name: copy
          image: ubuntu:22.04
          command:
            - /bin/bash
            - -c
            - |
              set -e
              domain="{{ tacet://org/Default/DevOps/Base/infra-domains/u }}"
              mkdir -p "/data/certs/${domain}"
              chown 1000:1000 "/data/certs/${domain}"
              for file in cert.pem chain.pem fullchain.pem privkey.pem; do
                echo "copy file ${file}"
                cp -L --remove-destination "/etc/letsencrypt/live/${domain}/${file}" "/data/certs/${domain}/${file}"
                chown 1000:1000 "/data/certs/${domain}/${file}"
              done
              echo done
          volumeMounts:
            - name: letsencrypt-etc
              mountPath: /etc/letsencrypt
              readOnly: true
            - name: certs-output
              mountPath: /data/certs
