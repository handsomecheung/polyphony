---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sabliergen
  namespace: default
spec:
  plugin:
    sablier:
      sablierUrl: "http://sablier.sablier"
      group: "gen"
      sessionDuration: "1h"
      dynamic:
        theme: "ghost"
        showDetails: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gen
  namespace: default
  labels:
    app.kubernetes.io/name: gen
    sablier.enable: "true"
    sablier.group: "gen"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gen
    spec:
      nodeSelector:
        kubernetes.io/hostname: nur
      volumes:
        - name: coder-workspaces
          hostPath:
            path: /mnt/coder-workspaces
            type: Directory
      containers:
        - name: app
          image: cloudpublic/default/gen:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: coder-workspaces
              subPath: private-workspace/repos/local/notebook/hardback/AI/Skills
              mountPath: /data/skills
              readOnly: true
            - name: coder-workspaces
              subPath: private-workspace/repos/local/polyphony/koishi/gen/output
              mountPath: /data/output
          env:
            - name: AI_MODEL
              value: balanced-model
            - name: LITELLM_API_BASE
              value: http://litellm.default
            - name: LITELLM_API_KEY
              value: "__{{koishi.litellm}}__"

            - name: AI_MODEL_TIMEOUT_SECONDS
              value: "120"
            - name: AI_AGENT_HEARTBEAT_SECONDS
              value: "10"
            - name: AI_OUTPUT_DIR
              value: /data/output
            - name: SKILLS_ROOT
              value: /data/skills
          ports:
            - name: default
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /ping
              port: default
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: default
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: default
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: gen
  namespace: default
  labels:
    app.kubernetes.io/name: gen
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gen
  ports:
    - name: default
      port: 80
      protocol: TCP
      targetPort: default

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gen
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: middleware-playonjan@kubernetescrd,middleware-antimitm@kubernetescrd,sso-domainx@kubernetescrd,default-sabliergen@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/name: Gen
    gethomepage.dev/href: https://gen.__{{infra.domains:f:x}}__/
    gethomepage.dev/weight: "10"
spec:
  ingressClassName: traefik
  rules:
    - host: gen.__{{infra.domains:f:x}}__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gen
                port:
                  name: default
  tls:
    - hosts:
        - gen.__{{infra.domains:f:x}}__
      secretName: gen-domainx
