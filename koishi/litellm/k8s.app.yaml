---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: default
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      volumes:
        - name: config
          configMap:
            name: litellm-config
      containers:
        - name: app
          image: ghcr.io/berriai/litellm:v1.106.6
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - name: default
              containerPort: 4000
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          env:
            - name: LITELLM_LOG
              value: INFO
            - name: UI_USERNAME
              value: "admin"
            - name: UI_PASSWORD
              value: "__{{koishi.litellm}}__"
            - name: OLLAMA_API_BASE
              value: "http://ollama"
            - name: LITELLM_MASTER_KEY
              value: "__{{koishi.litellm:f:master-key}}__"
            - name: LITELLM_SALT_KEY
              value: "__{{koishi.litellm:f:salt-key}}__"
            - name: DATABASE_URL
              value: "postgresql://litellm:__{{database.postgres-local.accounts:f:litellm}}__@postgres.database:5432/litellm"
            - name: GEMINI_API_KEY
              value: "__{{llm.api-keys:f:gemini-litellm}}__"
            - name: ANTHROPIC_API_KEY
              value: "__{{llm.api-keys:f:claude}}__"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: default
  labels:
    app: litellm
spec:
  type: ClusterIP
  ports:
    - name: default
      port: 80
      protocol: TCP
      targetPort: default
  selector:
    app: litellm

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: middleware-antimitm@kubernetescrd,sso-domainx@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/name: LiteLLM
    gethomepage.dev/href: https://litellm.__{{infra.domains:f:x}}__/ui
    gethomepage.dev/icon: https://framerusercontent.com/images/GtfMdzyrMj6FQY6lGLqI6bh2LYM.png
    gethomepage.dev/siteMonitor: https://litellm.__{{infra.domains:f:x}}__
    gethomepage.dev/weight: "30"
spec:
  ingressClassName: traefik
  rules:
    - host: litellm.__{{infra.domains:f:x}}__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  name: default
  tls:
    - hosts:
        - litellm.__{{infra.domains:f:x}}__
      secretName: litellm-domainx

---
# for Pi Agents
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-home4p
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
spec:
  ingressClassName: traefik
  rules:
    - host: litellm.home4p.__{{infra.domains:f:x}}__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  name: default
  tls:
    - hosts:
        - litellm.home4p.__{{infra.domains:f:x}}__
      secretName: litellm-home4p-domainx
