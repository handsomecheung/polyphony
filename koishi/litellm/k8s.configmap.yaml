---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: default
data:
  config.yaml: |
    model_list:
      - model_name: embedding
        litellm_params:
          model_info:
            id: ollama-embedding-bge-m3
          model: ollama/bge-m3
          api_base: "http://ollama"

      - model_name: balanced-model
        litellm_params:
          model_info:
            id: balanced-model-gemini-3_5-flash-lite
          model: gemini/gemini-3.5-flash-lite
          rpm: 100

      - model_name: agent-model
        litellm_params:
          model: gemini/gemini-3.8-flash
          reasoning_effort: medium

    router_settings:
      routing_strategy: simple-shuffle
      allowed_fails: 3                      # Cool down the endpoint if it fails 3 consecutive times
      cooldown_time: 300                    # Cool down duration in seconds (5 minutes)

    litellm_settings:
      num_retries: 2
      timeout: 30
      cache: True
      cache_params:
        type: redis
        url: "redis://redis.database:6379/0"
