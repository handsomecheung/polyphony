---
apiVersion: v1
kind: Namespace
metadata:
  name: ddns

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-envs
  namespace: ddns
data:
  DOMAIN_X: "{{ tacet://org/Default/DevOps/Base/infra-domains/x }}"
  DOMAIN_Y: "{{ tacet://org/Default/DevOps/Base/infra-domains/y }}"
  DOMAIN_P: "{{ tacet://org/Default/DevOps/Base/infra-domains/p }}"
  DOMAIN_C: "{{ tacet://org/Default/DevOps/Base/infra-domains/c }}"
  DOMAIN_D: "{{ tacet://org/Default/DevOps/Base/infra-domains/d }}"
  DOMAIN_U: "{{ tacet://org/Default/DevOps/Base/infra-domains/u }}"
  COMAPI_HOST_NUR: "http://{{ tacet://org/Default/DevOps/Koishi/infra.machine.nur/ip }}:{{ tacet://org/Default/DevOps/Koishi/comapi/port }}"
  COMAPI_HOST_NIPPON: "http://{{ tacet://org/Default/DevOps/Koishi/infra.machine.nippon/ip }}:{{ tacet://org/Default/DevOps/Koishi/comapi/port }}"
  COMAPI_HOST_MINIBA: "http://{{ tacet://org/Default/DevOps/Koishi/infra.machine.miniba/ip }}:{{ tacet://org/Default/DevOps/Koishi/comapi/port }}"
  COMAPI_PATH_IPV6: "/ipv6"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare
  namespace: ddns
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: app
              image: cloudpublic/default/ddns:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: common-envs
              env:
                - name: CLOUDFLARE_API_TOKEN
                  value: "{{ tacet://org/Default/DevOps/Koishi/cloudflare.dns-update.token/password }}"
              command:
                - python3
                - -u
                - run-cloudflare.py
          restartPolicy: Never

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aliyun
  namespace: ddns
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: app
              image: cloudpublic/default/ddns:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: common-envs
              env:
                - name: ACCESS_ID
                  value: "{{ tacet://org/Default/DevOps/Koishi/aliyun.dns-update.key/id }}"
                - name: ACCESS_SECRET
                  value: "{{ tacet://org/Default/DevOps/Koishi/aliyun.dns-update.key/secret }}"
              command:
                - python3
                - -u
                - run-aliyun.py
          restartPolicy: Never
