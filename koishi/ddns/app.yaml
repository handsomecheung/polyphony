---
apiVersion: v1
kind: Namespace
metadata:
  name: ddns

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-envs
  namespace: ddns
data:
  DOMAIN_X: "{{ tacet://*/infra.domains/x }}"
  DOMAIN_Y: "{{ tacet://*/infra.domains/y }}"
  DOMAIN_P: "{{ tacet://*/infra.domains/p }}"
  DOMAIN_C: "{{ tacet://*/infra.domains/c }}"
  DOMAIN_D: "{{ tacet://*/infra.domains/d }}"
  DOMAIN_U: "{{ tacet://*/infra.domains/u }}"
  COMAPI_HOST_NUR: "http://{{ tacet://*/infra.machine.nur/ip }}:{{ tacet://*/koishi.comapi.port/password }}"
  COMAPI_HOST_NIPPON: "http://{{ tacet://*/infra.machine.nippon/ip }}:{{ tacet://*/koishi.comapi.port/password }}"
  COMAPI_HOST_MINIBA: "http://{{ tacet://*/infra.machine.miniba/ip }}:{{ tacet://*/koishi.comapi.port/password }}"
  COMAPI_PATH_IPV6: "/ipv6"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare
  namespace: ddns
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: app
              image: cloudpublic/default/ddns:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: common-envs
              env:
                - name: CLOUDFLARE_API_TOKEN
                  value: "{{ tacet://*/cloudflare.dns-update.token/password }}"
              command:
                - python3
                - -u
                - run-cloudflare.py
          restartPolicy: Never

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aliyun
  namespace: ddns
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: app
              image: cloudpublic/default/ddns:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: common-envs
              env:
                - name: ACCESS_ID
                  value: "{{ tacet://*/aliyun.dns-update.key/id }}"
                - name: ACCESS_SECRET
                  value: "{{ tacet://*/aliyun.dns-update.key/secret }}"
              command:
                - python3
                - -u
                - run-aliyun.py
          restartPolicy: Never
