---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: ck-dev
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgis:18-3.6-system-trixie

  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - "*"
        source:
          externalCluster: postgres-old
      # インポート開始前にロールを作成
      postInitSQL:
        - CREATE ROLE nulltrace WITH LOGIN PASSWORD '{{ tacet://*/database.postgres.ck-dev.accounts/nulltrace }}';
        - CREATE ROLE formant WITH LOGIN PASSWORD '{{ tacet://*/database.postgres.ck-dev.accounts/formant }}';
        - CREATE ROLE kausabu WITH LOGIN PASSWORD '{{ tacet://*/database.postgres.ck-dev.accounts/kausabu }}';
        - CREATE ROLE home WITH LOGIN PASSWORD '{{ tacet://*/database.postgres.ck-dev.accounts/home }}';
        - CREATE ROLE pushion WITH LOGIN PASSWORD '{{ tacet://*/database.postgres.ck-dev.accounts/pushion }}';
        - CREATE ROLE forma WITH LOGIN PASSWORD '{{ tacet://*/database.postgres.ck-dev.accounts/forma }}';

  externalClusters:
    - name: postgres-old
      connectionParameters:
        host: postgres.db-dev.svc.cluster.local
        user: postgres
        dbname: default
        sslmode: disable
      password:
        name: postgres-external-creds
        key: password

  storage:
    size: 1Gi
    storageClass: local-path-retain

  monitoring:
    enablePodMonitor: false
