---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: ck-prod
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgis:18-3.6-system-trixie

  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - "*"
        source:
          externalCluster: postgres-old
      postInitSQL:
        - CREATE ROLE home WITH LOGIN PASSWORD '{{ tacet://*/database.postgres.ck-prod.accounts/home }}';
        - CREATE ROLE formant WITH LOGIN PASSWORD '{{ tacet://*/database.postgres.ck-prod.accounts/formant }}';
        - CREATE ROLE forma WITH LOGIN PASSWORD '{{ tacet://*/database.postgres.ck-prod.accounts/forma }}';
        - CREATE ROLE pushion WITH LOGIN PASSWORD '{{ tacet://*/database.postgres.ck-prod.accounts/pushion }}';
        - CREATE ROLE nulltrace WITH LOGIN PASSWORD '{{ tacet://*/database.postgres.ck-prod.accounts/nulltrace }}';

  externalClusters:
    - name: postgres-old
      connectionParameters:
        host: postgres.db-prod.svc.cluster.local
        user: postgres
        dbname: default
        sslmode: disable
      password:
        name: postgres-external-creds
        key: password

  storage:
    size: 10Gi
    storageClass: local-path-retain

  monitoring:
    enablePodMonitor: false
