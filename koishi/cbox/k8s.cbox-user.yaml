---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cbox-user
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cbox-user-binding
  namespace: ck-dev
subjects:
  - kind: ServiceAccount
    name: cbox-user
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cbox-user-binding
  namespace: builder
subjects:
  - kind: ServiceAccount
    name: cbox-user
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: Secret
metadata:
  name: cbox-user-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: cbox-user
type: kubernetes.io/service-account-token
