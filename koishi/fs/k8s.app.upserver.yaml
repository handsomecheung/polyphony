---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sablierfsupserver
  namespace: default
spec:
  plugin:
    sablier:
      sablierUrl: "http://sablier.sablier"
      group: "fsupserver"
      sessionDuration: "30m"
      dynamic:
        theme: "ghost"
        showDetails: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fs-upserver
  namespace: default
  labels:
    app: fs-upserver
    sablier.enable: "true"
    sablier.group: "fsupserver"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: fs-upserver
  template:
    metadata:
      labels:
        app: fs-upserver
    spec:
      nodeSelector:
        kubernetes.io/hostname: nur
      volumes:
        - name: files
          hostPath:
            path: /mnt/coder-sharepoint/upserver
            type: DirectoryOrCreate
      containers:
        - name: app
          image: cloudpublic/default/fs-upserver:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: files
              mountPath: /files
          ports:
            - name: default
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /ok
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ok
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: fs-upserver
  namespace: default
  labels:
    app: fs-upserver
spec:
  type: ClusterIP
  ports:
    - name: default
      port: 80
      protocol: TCP
      targetPort: default
  selector:
    app: fs-upserver

---
# Sets the maximum request body to 2G
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fsupserversizelimit
  namespace: default
spec:
  buffering:
    maxRequestBodyBytes: 2000000000

---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: fsbasicauth
  namespace: default
data:
  auth: __{{fileserver.basicauth}}__

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fsbasicauth
  namespace: default
spec:
  basicAuth:
    secret: fsbasicauth

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fs-upserver
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: middleware-antimitm@kubernetescrd,default-fsbasicauth@kubernetescrd,default-sablierfsupserver@kubernetescrd,default-fsupserversizelimit@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Network
    gethomepage.dev/name: fs-upserver
    gethomepage.dev/href: https://p.__{{infra.domains:f:x}}__/
    gethomepage.dev/weight: "5"
spec:
  ingressClassName: traefik
  rules:
    - host: p.__{{infra.domains:f:x}}__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fs-upserver
                port:
                  name: default
  tls:
    - hosts:
        - p.__{{infra.domains:f:x}}__
      secretName: p-domainx
