---
services:
  watchtower:
    image: containrrr/watchtower:latest
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Koishi/Base/infra-infos/timezone }}"
      DOCKER_API_VERSION: "1.53"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/box/.docker/config.json:/config.json
    command: --interval 120
    restart: always

  comapi:
    image: {{ tacet://org/Default/DevOps/Koishi/Base/infra-infos/cloudpublic-registry-host }}/{{ tacet://org/Default/DevOps/Koishi/Base/infra-infos/cloudpublic-registry-id }}/compose/comapi:latest
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Koishi/Base/infra-infos/timezone }}"
      KOISHI_IPV4_PREFIX: "{{ tacet://org/Default/DevOps/Koishi/Base/infra-infos/subnetv4 }}."
    pid: host
    network_mode: host # exposed port 37900
    restart: always

  shutdown:
    image: {{ tacet://org/Default/DevOps/Koishi/Base/infra-infos/cloudpublic-registry-host }}/{{ tacet://org/Default/DevOps/Koishi/Base/infra-infos/cloudpublic-registry-id }}/compose/shutdown:latest
    environment:
      TZ: "{{ tacet://org/Default/DevOps/Koishi/Base/infra-infos/timezone }}"
      TERM: "xterm-256color"
      GOTTY_PORT: "37901"
      GOTTY_WS_ORIGIN: ".*"
    volumes:
      - /home/box/.kube/config:/root/.kube/config
      - /bin/systemctl:/bin/systemctl
      - /run/systemd/system:/run/systemd/system
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /sys/fs/cgroup:/sys/fs/cgroup
    privileged: true
    network_mode: host # exposed port 37901
    restart: always
