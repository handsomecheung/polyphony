[webdav-openlist]
type = webdav
url = http://openlist/dav
vendor = other
user = rclone
# podman run -it --rm rclone/rclone:latest obscure '${password}'
pass = {{ tacet://*/openlist.accounts/rcloneconfig }}
bwlimit = 20M

# currently pikpak webdav protocol only supports read-only operations
[webdav-pikpak]
type = webdav
url = https://dav.mypikpak.com
vendor = other
user = zfvn
# podman run -it --rm rclone/rclone:latest obscure '${password}'
pass = {{ tacet://*/pikpak.webdav/zfvn_obscure }}
bwlimit = 20M

[pikpak]
type = pikpak
user = {{ tacet://*/infra-emails/hh }}
pass = {{ tacet://*/pikpak/rcloneconfig }}
device_id =
captcha_token =
token =
bwlimit = 20M

[pikpak-encrypted-backup]
type = crypt
remote = pikpak:/backup/e
filename_encryption = standard
directory_name_encryption = true
# podman run -it --rm rclone/rclone:latest obscure securepassword
password = {{ tacet://*/rclone.crypt/pikpak-encrypted-backup }}

[gdrive]
type = drive
client_id = {{ tacet://*/google.credentials.koishi.oauth.rclone/client_id }}
client_secret = {{ tacet://*/google.credentials.koishi.oauth.rclone/client_secret }}
scope = drive
token = "__placeholder__"
team_drive =
bwlimit = 20M

[gdrive-encrypted-backup]
type = crypt
remote = gdrive:/SharePoint/backup/e
filename_encryption = standard
directory_name_encryption = true
# docker run -it --rm rclone/rclone:latest obscure securepassword
password = {{ tacet://*/rclone.crypt/gdrive-encrypted-backup }}
