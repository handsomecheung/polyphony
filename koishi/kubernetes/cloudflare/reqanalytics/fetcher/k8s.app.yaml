---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reqanalytics-fetcher-config
  namespace: cloudflare
data:
  DOMAIN_X: "{{ tacet://org/Default/DevOps/Base/infra-domains/x }}"
  DOMAIN_C: "{{ tacet://org/Default/DevOps/Base/infra-domains/c }}"
  DOMAIN_D: "{{ tacet://org/Default/DevOps/Base/infra-domains/d }}"
  OUTPUT_DIR: "/data"
  LOOKBACK_HOURS: "48"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reqanalytics-fetcher
  namespace: cloudflare
spec:
  schedule: "9 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: nur
          containers:
            - name: app
              image: python:3.12-slim
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: reqanalytics-fetcher-config
              env:
                - name: CLOUDFLARE_ANALYTICS_TOKEN
                  value: "{{ tacet://org/Default/DevOps/Koishi/cloudflare.analytics.token/password }}"
              command:
                - python3
                - -u
                - /app/fetcher.py
              volumeMounts:
                - name: code
                  mountPath: /app
                  readOnly: true
                - name: data
                  mountPath: /data
          volumes:
            - name: code
              configMap:
                name: reqanalytics-fetcher-code
            - name: data
              hostPath:
                path: /mnt/coder-workspaces/private-workspace/repos/local/polyphony/koishi/kubernetes/cloudflare/reqanalytics/data
                type: DirectoryOrCreate
          restartPolicy: Never
