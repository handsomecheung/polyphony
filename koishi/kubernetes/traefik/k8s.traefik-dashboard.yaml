---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-dashboard
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: middleware-antimitm@kubernetescrd,sso-domainx@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Kubernetes
    gethomepage.dev/name: traefik
    gethomepage.dev/app: traefik
    gethomepage.dev/icon: traefik
    gethomepage.dev/href: https://traefik.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}/dashboard/
    gethomepage.dev/siteMonitor: https://traefik.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}/dashboard/
    gethomepage.dev/weight: "10"
    gethomepage.dev/pod-selector: ""
spec:
  ingressClassName: traefik
  rules:
    - host: traefik.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  number: 8080
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  number: 8080
  tls:
    - hosts:
        - traefik.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}
      secretName: traefik-dashboard-domainx
