---
apiVersion: v1
kind: Secret
metadata:
  name: domaind
  namespace: sso
type: Opaque
data:
  clientid: {{ tacet://*/traefik.oss.domaind.keys/gcp-clientid?encoding=base64 }}
  clientsecret: {{ tacet://*/traefik.oss.domaind.keys/gcp-clientsecret?encoding=base64 }}
  # something random
  secret: {{ tacet://*/traefik.oss.domaind.keys/secret?encoding=base64 }}

---
# https://github.com/thomseddon/traefik-forward-auth
apiVersion: apps/v1
kind: Deployment
metadata:
  name: domaind
  namespace: sso
  labels:
    app.kubernetes.io/name: domaind
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: domaind
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domaind
    spec:
      containers:
        - name: app
          image: thomseddon/traefik-forward-auth:latest
          imagePullPolicy: Always
          args:
            [
              "--rule.high.action=auth",
              '--rule.high.rule="Host(`subscout.{{ tacet://*/infra.domains/d }}`)"',
              '--rule.high.whitelist="{{ tacet://*/infra-emails/hh }},{{ tacet://*/infra-emails/hz }}"',
            ]
          env:
            - name: PROVIDERS_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: domaind
                  key: clientid
            - name: PROVIDERS_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: domaind
                  key: clientsecret
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: domaind
                  key: secret
            - name: COOKIE_DOMAIN
              value: {{ tacet://*/infra.domains/d }}
            - name: AUTH_HOST
              value: gsso.{{ tacet://*/infra.domains/d }}
            - name: INSECURE_COOKIE
              value: "false"
            - name: URL_PATH
              value: /_oauth
            - name: WHITELIST
              value: {{ tacet://*/infra-emails/hh }},{{ tacet://*/infra-emails/hz }},{{ tacet://*/infra-emails/cq }},{{ tacet://*/infra-emails/ck }}
            - name: LOG_LEVEL
              value: info
            - name: LIFETIME
              value: "31536000" # 1 year
          ports:
            - name: default
              containerPort: 4181

---
kind: Service
apiVersion: v1
metadata:
  name: domaind
  namespace: sso
spec:
  selector:
    app.kubernetes.io/name: domaind
  ports:
    - name: default
      protocol: TCP
      port: 80
      targetPort: default

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: domaind
  namespace: sso
spec:
  forwardAuth:
    address: http://domaind.sso.svc.cluster.local
    authResponseHeaders:
      - X-Forwarded-User
    trustForwardHeader: true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domaind
  namespace: sso
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: sso-domaind@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: gsso.{{ tacet://*/infra.domains/d }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: domaind
                port:
                  name: default
  tls:
    - hosts:
        - gsso.{{ tacet://*/infra.domains/d }}
      secretName: auth-domaind
