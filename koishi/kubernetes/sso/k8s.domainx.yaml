---
apiVersion: v1
kind: Secret
metadata:
  name: domainx
  namespace: sso
type: Opaque
data:
  clientid: {{ tacet://org/Default/DevOps/Koishi/traefik.oss.domainx.keys/gcp-clientid?encoding=base64 }}
  clientsecret: {{ tacet://org/Default/DevOps/Koishi/traefik.oss.domainx.keys/gcp-clientsecret?encoding=base64 }}
  # something random
  secret: {{ tacet://org/Default/DevOps/Koishi/traefik.oss.domainx.keys/secret?encoding=base64 }}

---
# https://github.com/thomseddon/traefik-forward-auth
apiVersion: apps/v1
kind: Deployment
metadata:
  name: domainx
  namespace: sso
  labels:
    app.kubernetes.io/name: domainx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: domainx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domainx
    spec:
      containers:
        - name: app
          image: thomseddon/traefik-forward-auth:latest
          imagePullPolicy: Always
          args:
            [
              "--rule.vw.action=auth",
              '--rule.vw.rule="Host(`vaultwarden.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`) && Path(`/admin`)"',
              '--rule.vw.whitelist="{{ tacet://org/Default/DevOps/Base/infra-emails/hh }}"',

              "--rule.high.action=auth",
              '--rule.high.rule="Host(`cockpit-nur.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `shutdown-nur.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `router-netgear.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `router-ntt.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `router-ntt-softbank.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `traefik.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `kubernetes.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `dbgate.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `jackett.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `shouseki.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `bliss.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `jellyfin.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `qbittorrent-vuetorrent.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `qbittorrent.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `stable-diffusion-webui.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `wakeup.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `wireguard.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `wireproxy.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `mbtty.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `mbvnc.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `openclaw.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`)"',
              '--rule.high.whitelist="{{ tacet://org/Default/DevOps/Base/infra-emails/hh }}"',

              "--rule.dev.action=auth",
              '--rule.dev.rule="Host(`pikvm-controller.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `pikvm.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `guacamole.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `devbox-nur-codeserver.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `ollama-webui.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `n8n.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `chameleon.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `grafana.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `jupyterlab-tensor.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`, `jupyterlab-torch.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`)"',
              '--rule.dev.whitelist="{{ tacet://org/Default/DevOps/Base/infra-emails/hh }},{{ tacet://org/Default/DevOps/Base/infra-emails/hz }}"',

              "--rule.hz.action=auth",
              '--rule.hz.rule="Host(`dbgate-lite.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}`)"',
              '--rule.hz.whitelist="{{ tacet://org/Default/DevOps/Base/infra-emails/hz }}"',
            ]
          env:
            - name: PROVIDERS_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: domainx
                  key: clientid
            - name: PROVIDERS_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: domainx
                  key: clientsecret
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: domainx
                  key: secret
            - name: COOKIE_DOMAIN
              value: {{ tacet://org/Default/DevOps/Base/infra-domains/x }}
            - name: AUTH_HOST
              value: gsso.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}
            - name: INSECURE_COOKIE
              value: "false"
            - name: URL_PATH
              value: /_oauth
            - name: WHITELIST
              value: {{ tacet://org/Default/DevOps/Base/infra-emails/hh }},{{ tacet://org/Default/DevOps/Base/infra-emails/hz }},{{ tacet://org/Default/DevOps/Base/infra-emails/cq }},{{ tacet://org/Default/DevOps/Base/infra-emails/ck }}
            - name: LOG_LEVEL
              value: info
            - name: LIFETIME
              value: "31536000" # 1 year
          ports:
            - name: default
              containerPort: 4181

---
kind: Service
apiVersion: v1
metadata:
  name: domainx
  namespace: sso
spec:
  selector:
    app.kubernetes.io/name: domainx
  ports:
    - name: default
      protocol: TCP
      port: 80
      targetPort: default

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: domainx
  namespace: sso
spec:
  forwardAuth:
    address: http://domainx.sso.svc.cluster.local
    authResponseHeaders:
      - X-Forwarded-User
    trustForwardHeader: true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domainx
  namespace: sso
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: sso-domainx@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: gsso.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: domainx
                port:
                  name: default
  tls:
    - hosts:
        - gsso.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}
      secretName: auth-domainx
