---
apiVersion: v1
kind: Secret
metadata:
  name: domainp
  namespace: sso
type: Opaque
data:
  clientid: {{ tacet://*/traefik.oss.domainp.keys/gcp-clientid?encoding=base64 }}
  clientsecret: {{ tacet://*/traefik.oss.domainp.keys/gcp-clientsecret?encoding=base64 }}
  # something random
  secret: {{ tacet://*/traefik.oss.domainp.keys/secret?encoding=base64 }}

---
# https://github.com/thomseddon/traefik-forward-auth
apiVersion: apps/v1
kind: Deployment
metadata:
  name: domainp
  namespace: sso
  labels:
    app.kubernetes.io/name: domainp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: domainp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domainp
    spec:
      containers:
        - name: app
          image: thomseddon/traefik-forward-auth:latest
          imagePullPolicy: Always
          args:
            [
              "--rule.high.action=auth",
              '--rule.high.rule="Host(`mq.{{ tacet://*/infra.domains/p }}`)"',
              '--rule.high.whitelist="{{ tacet://*/infra-emails/hh }}"',

              "--rule.dev.action=auth",
              '--rule.dev.rule="Host(`webapp-dev.{{ tacet://*/infra.domains/p }}`, `mq-dev.{{ tacet://*/infra.domains/p }}`)"',
              '--rule.dev.whitelist="{{ tacet://*/infra-emails/hh }},{{ tacet://*/infra-emails/hz }}"',

              "--rule.dev.action=auth",
              '--rule.dev.rule="Host(`webapp-cdev.{{ tacet://*/infra.domains/p }}`)"',
              '--rule.dev.whitelist="{{ tacet://*/infra-emails/hh }},{{ tacet://*/infra-emails/hz }},{{ tacet://*/infra-emails/cq }}"',
            ]
          env:
            - name: PROVIDERS_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: domainp
                  key: clientid
            - name: PROVIDERS_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: domainp
                  key: clientsecret
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: domainp
                  key: secret
            - name: COOKIE_DOMAIN
              value: {{ tacet://*/infra.domains/p }}
            - name: AUTH_HOST
              value: gsso.{{ tacet://*/infra.domains/p }}
            - name: INSECURE_COOKIE
              value: "false"
            - name: URL_PATH
              value: /_oauth
            - name: WHITELIST
              value: {{ tacet://*/infra-emails/hh }},{{ tacet://*/infra-emails/hz }},{{ tacet://*/infra-emails/cq }}
            - name: LOG_LEVEL
              value: info
            - name: LIFETIME
              value: "31536000" # 1 year
          ports:
            - name: default
              containerPort: 4181

---
kind: Service
apiVersion: v1
metadata:
  name: domainp
  namespace: sso
spec:
  selector:
    app.kubernetes.io/name: domainp
  ports:
    - name: default
      protocol: TCP
      port: 80
      targetPort: default

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: domainp
  namespace: sso
spec:
  forwardAuth:
    address: http://domainp.sso.svc.cluster.local
    authResponseHeaders:
      - X-Forwarded-User
    trustForwardHeader: true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domainp
  namespace: sso
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: sso-domainp@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: gsso.{{ tacet://*/infra.domains/p }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: domainp
                port:
                  name: default
  tls:
    - hosts:
        - gsso.{{ tacet://*/infra.domains/p }}
      secretName: auth-domainp
