---
apiVersion: v1
kind: Secret
metadata:
  name: domainc
  namespace: sso
type: Opaque
data:
  clientid: {{ tacet://org/Default/DevOps/Koishi/traefik.oss.domainc.keys/gcp-clientid?encoding=base64 }}
  clientsecret: {{ tacet://org/Default/DevOps/Koishi/traefik.oss.domainc.keys/gcp-clientsecret?encoding=base64 }}
  # something random
  secret: {{ tacet://org/Default/DevOps/Koishi/traefik.oss.domainc.keys/secret?encoding=base64 }}

---
# https://github.com/thomseddon/traefik-forward-auth
apiVersion: apps/v1
kind: Deployment
metadata:
  name: domainc
  namespace: sso
  labels:
    app.kubernetes.io/name: domainc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: domainc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domainc
    spec:
      containers:
        - name: app
          image: thomseddon/traefik-forward-auth:latest
          imagePullPolicy: Always
          args: []
          env:
            - name: PROVIDERS_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: domainc
                  key: clientid
            - name: PROVIDERS_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: domainc
                  key: clientsecret
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: domainc
                  key: secret
            - name: COOKIE_DOMAIN
              value: {{ tacet://org/Default/DevOps/Base/infra-domains/c }}
            - name: AUTH_HOST
              value: gsso.{{ tacet://org/Default/DevOps/Base/infra-domains/c }}
            - name: INSECURE_COOKIE
              value: "false"
            - name: URL_PATH
              value: /_oauth
            - name: WHITELIST
              value: {{ tacet://org/Default/DevOps/Base/infra-emails/hh }},{{ tacet://org/Default/DevOps/Base/infra-emails/hz }},{{ tacet://org/Default/DevOps/Base/infra-emails/cq }},{{ tacet://org/Default/DevOps/Base/infra-emails/ck }},{{ tacet://org/Default/DevOps/Base/infra-emails/ckwkk }}
            - name: LOG_LEVEL
              value: info
            - name: LIFETIME
              value: "31536000" # 1 year
          ports:
            - name: default
              containerPort: 4181

---
kind: Service
apiVersion: v1
metadata:
  name: domainc
  namespace: sso
spec:
  selector:
    app.kubernetes.io/name: domainc
  ports:
    - name: default
      protocol: TCP
      port: 80
      targetPort: default

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: domainc
  namespace: sso
spec:
  forwardAuth:
    address: http://domainc.sso.svc.cluster.local
    authResponseHeaders:
      - X-Forwarded-User
    trustForwardHeader: true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domainc
  namespace: sso
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: sso-domainc@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: gsso.{{ tacet://org/Default/DevOps/Base/infra-domains/c }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: domainc
                port:
                  name: default
  tls:
    - hosts:
        - gsso.{{ tacet://org/Default/DevOps/Base/infra-domains/c }}
      secretName: sso-domainc
