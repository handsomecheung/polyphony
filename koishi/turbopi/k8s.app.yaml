---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: turbopi
  namespace: default
  labels:
    app.kubernetes.io/name: turbopi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: turbopi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: turbopi
    spec:
      containers:
        - name: app
          image: cloudpublic/default/turbopi:latest
          ports:
            - name: default
              containerPort: 3000
          env:
            - name: TURBOPI_IP
              value: "__{{infra.machine.r4b8gTurboPi:f:ip}}__"
            - name: RPC_URL
              value: "http://__{{infra.machine.r4b8gTurboPi:f:ip}}__:9030"
            - name: CAMERA_STREAM_URL
              value: "http://__{{infra.machine.r4b8gTurboPi:f:ip}}__:8080"
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: turbopi
  namespace: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: turbopi
  ports:
    - name: default
      port: 80
      targetPort: 3000
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: turbopi
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: middleware-antimitm@kubernetescrd,sso-domainx@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Tool
    gethomepage.dev/name: TurboPi
    gethomepage.dev/href: https://turbopi.__{{infra.domains:f:x}}__
    gethomepage.dev/weight: "85"
spec:
  ingressClassName: traefik
  rules:
    - host: turbopi.__{{infra.domains:f:x}}__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: turbopi
                port:
                  name: default
  tls:
    - hosts:
        - turbopi.__{{infra.domains:f:x}}__
      secretName: turbopi-domainx
