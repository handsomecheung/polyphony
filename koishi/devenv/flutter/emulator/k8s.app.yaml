---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emulator
  namespace: devenv-flutter
  labels:
    app.kubernetes.io/name: emulator
    sablier.enable: "true"
    sablier.group: "fluttertest"
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emulator
    spec:
      nodeSelector:
        kubernetes.io/hostname: nur
      containers:
        - name: app
          image: budtmo/docker-android:emulator_14.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          ports:
            - name: adb
              containerPort: 5555
              protocol: TCP
          env:
            - name: EMULATOR_DEVICE
              value: "Nexus 5"
            - name: WEB_VNC
              value: "false"
            - name: WEB_LOG
              value: "false"
            - name: APPIUM
              value: "false"
            - name: AUTO_RECORD
              value: "false"
            - name: EXTRA
              value: "-no-snapshot-load -no-audio"
          startupProbe:
            exec:
              command: ["sh", "-c", "adb shell getprop sys.boot_completed | grep -q 1"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "adb shell getprop sys.boot_completed | grep -q 1"]
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: adb
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: kvm
              mountPath: /dev/kvm
          resources:
            requests:
              cpu: 2000m
              memory: 6Gi
            limits:
              cpu: 8000m
              memory: 10Gi
      volumes:
        - name: kvm
          hostPath:
            path: /dev/kvm

---
apiVersion: v1
kind: Service
metadata:
  name: emulator
  namespace: devenv-flutter
  labels:
    app.kubernetes.io/name: emulator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: emulator
  ports:
    - name: adb
      port: 5555
      targetPort: 5555
      protocol: TCP
