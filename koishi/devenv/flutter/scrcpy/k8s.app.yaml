---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrcpy
  namespace: devenv-flutter
  labels:
    app.kubernetes.io/name: scrcpy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scrcpy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scrcpy
    spec:
      nodeSelector:
        kubernetes.io/hostname: nur
      containers:
        - name: app
          image: cloudpublic/default/ws-scrcpy:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ADB_DEVICE_ADDRESS
              value: "emulator.devenv-flutter:5555"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi

---
apiVersion: v1
kind: Service
metadata:
  name: scrcpy
  namespace: devenv-flutter
  labels:
    app.kubernetes.io/name: scrcpy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scrcpy
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scrcpy
  namespace: devenv-flutter
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: middleware-antimitm@kubernetescrd,sso-domainx@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Development
    gethomepage.dev/name: ScrCpy
    gethomepage.dev/icon: scrcpy
    gethomepage.dev/href: https://scrcpy.__{{infra.domains:f:x}}__/
    gethomepage.dev/weight: "65"
spec:
  ingressClassName: traefik
  rules:
    - host: scrcpy.__{{infra.domains:f:x}}__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scrcpy
                port:
                  name: http
  tls:
    - hosts:
        - scrcpy.__{{infra.domains:f:x}}__
      secretName: scrcpy-tls
