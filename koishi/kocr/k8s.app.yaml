---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sablierkocr
  namespace: default
spec:
  plugin:
    sablier:
      sablierUrl: "http://sablier.sablier"
      group: "kocr"
      sessionDuration: "30m"
      blocking:
        timeout: 5m

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kocr
  namespace: default
  labels:
    app.kubernetes.io/name: kocr
    sablier.enable: "true"
    sablier.group: "kocr"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kocr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kocr
    spec:
      containers:
        - name: app
          image: cloudpublic/default/kocr:latest
          imagePullPolicy: Always
          ports:
            - name: default
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: default
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: default
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: default
            periodSeconds: 10
          resources:
            requests:
              cpu: 2000m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kocr
  namespace: default
  labels:
    app.kubernetes.io/name: kocr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kocr
  ports:
    - name: default
      port: 80
      targetPort: default
      protocol: TCP

---
# Sets the maximum request body to 100M
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kocrsizelimit
  namespace: default
spec:
  buffering:
    maxRequestBodyBytes: 100000000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kocr
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: default-lanonly@kubernetescrd,default-kocrsizelimit@kubernetescrd,default-sablierkocr@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: kocr.home4p.__{{infra.domains:f:x}}__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kocr
                port:
                  name: default
  tls:
    - hosts:
        - kocr.home4p.__{{infra.domains:f:x}}__
      secretName: kocr-home4p-tls
