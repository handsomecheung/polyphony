---
# https://github.com/dani-garcia/vaultwarden
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: default-vaultwarden
  labels:
    app: vaultwarden
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
      app.kubernetes.io/name: vaultwarden
      app.kubernetes.io/instance: vaultwarden
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vaultwarden
        app.kubernetes.io/name: vaultwarden
        app.kubernetes.io/instance: vaultwarden
    spec:
      nodeSelector:
        kubernetes.io/hostname: nur
      volumes:
        - name: vaultwarden-encrypted
          hostPath:
            path: /mnt/runtime-data-app/vaultwarden
            type: Directory
      containers:
        - name: app
          image: vaultwarden/server:latest
          imagePullPolicy: Always
          env:
            - name: LOG_FILE
              value: "/log/vaultwarden.log"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: vaultwarden-encrypted
              subPath: data
              mountPath: /data
            - name: vaultwarden-encrypted
              subPath: log
              mountPath: /log
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 50Mi

---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: default-vaultwarden
  labels:
    app: vaultwarden
spec:
  type: ClusterIP
  ports:
    - name: default
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: vaultwarden

---
# Sets the maximum request body to 525MB
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sizelimit
  namespace: default-vaultwarden
spec:
  buffering:
    maxRequestBodyBytes: 525000000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: default-vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: middleware-playonjan@kubernetescrd,middleware-antimitm@kubernetescrd,default-vaultwarden-sizelimit@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Tool
    gethomepage.dev/name: Vaultwarden
    gethomepage.dev/icon: vaultwarden
    gethomepage.dev/href: https://vaultwarden.{{ tacet://*/infra.domains/x }}/
    gethomepage.dev/siteMonitor: https://vaultwarden.{{ tacet://*/infra.domains/x }}/
    gethomepage.dev/weight: "30"
spec:
  ingressClassName: traefik
  rules:
    - host: vaultwarden.{{ tacet://*/infra.domains/x }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  name: default
  tls:
    - hosts:
        - vaultwarden.{{ tacet://*/infra.domains/x }}
      secretName: vaultwarden-domainx

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden-admin
  namespace: default-vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: middleware-antimitm@kubernetescrd,sso-domainx@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Tool
    gethomepage.dev/name: Vaultwarden Admin
    gethomepage.dev/app: vaultwarden
    gethomepage.dev/icon: vaultwarden
    gethomepage.dev/href: https://vaultwarden.{{ tacet://*/infra.domains/x }}/admin
    gethomepage.dev/siteMonitor: https://vaultwarden.{{ tacet://*/infra.domains/x }}/admin
    gethomepage.dev/weight: "40"
spec:
  ingressClassName: traefik
  rules:
    - host: vaultwarden.{{ tacet://*/infra.domains/x }}
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  name: default
  tls:
    - hosts:
        - vaultwarden.{{ tacet://*/infra.domains/x }}
      secretName: vaultwarden-domainx

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portwarden-dns-config
  namespace: default-vaultwarden
data:
  hosts: |
    {{ tacet://*/infra.machine.nippon/ip }} vaultwarden.{{ tacet://*/infra.domains/x }}

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: portwarden
  namespace: default-vaultwarden
  labels:
    app: portwarden
spec:
  schedule: "30 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: portwarden
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: nur
          volumes:
            - name: dns-config
              configMap:
                name: portwarden-dns-config
            - name: env
              hostPath:
                path: /mnt/coder-workspaces/private-workspace/repos/local/polyphony/koishi/vaultwarden/portwarden/.env
                type: File
            - name: local
              hostPath:
                path: /mnt/user-data-others/ebackup/upload/local/vaultwarden/portwarden/
                type: DirectoryOrCreate
          containers:
            - name: app
              image: cloudprivate/default/portwarden:latest
              imagePullPolicy: Always
              env:
                - name: URL_VW
                  value: https://vaultwarden.{{ tacet://*/infra.domains/x }}
                - name: URL_PASS
                  value: http://fs-downserver-private.default.svc.cluster.local/private/thepassbase
              volumeMounts:
                - name: dns-config
                  mountPath: /etc/hosts
                  subPath: hosts
                  readOnly: true
                - name: env
                  mountPath: /.env
                - name: local
                  mountPath: /data/export
              resources:
                requests:
                  cpu: 50m
                  memory: 100Mi

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-vaultwarden
  namespace: default-vaultwarden
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - vaultwarden
  policyTypes:
    - Egress
  egress: []

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-apps
  namespace: default-vaultwarden
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - datadirbackup
          - portwarden
  policyTypes:
    - Egress
  egress:
    # Allow communication to Kubernetes DNS service
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
        - podSelector:
            matchLabels:
              app: fs-downserver
    - to:
        - podSelector:
            matchLabels:
              app: vaultwarden
    - to:
        - ipBlock:
            cidr: {{ tacet://*/koishi.infra.infos/subnetv4 }}.0/24
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
