---
apiVersion: v1
kind: Secret
metadata:
  name: foldersync-sshkeys-system
  namespace: default
type: Opaque
data:
  ssh_host_ecdsa_key: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.system.files/ssh_host_ecdsa_key?encoding=base64 }}
  ssh_host_ecdsa_key.pub: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.system.files/ssh_host_ecdsa_key.pub?encoding=base64 }}
  ssh_host_ed25519_key: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.system.files/ssh_host_ed25519_key?encoding=base64 }}
  ssh_host_ed25519_key.pub: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.system.files/ssh_host_ed25519_key.pub?encoding=base64 }}
  ssh_host_rsa_key: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.system.files/ssh_host_rsa_key?encoding=base64 }}
  ssh_host_rsa_key.pub: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.system.files/ssh_host_rsa_key.pub?encoding=base64 }}

---
apiVersion: v1
kind: Secret
metadata:
  name: foldersync-sshkeys-user-hh
  namespace: default
type: Opaque
data:
  authorized_keys: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.hh.files/id_rsa.pub?encoding=base64 }}
  id_rsa: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.hh.files/id_rsa?encoding=base64 }}
  id_rsa.pub: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.hh.files/id_rsa.pub?encoding=base64 }}

---
apiVersion: v1
kind: Secret
metadata:
  name: foldersync-sshkeys-user-cc
  namespace: default
type: Opaque
data:
  authorized_keys: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.cc.files/id_rsa.pub?encoding=base64 }}
  id_rsa: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.cc.files/id_rsa?encoding=base64 }}
  id_rsa.pub: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.cc.files/id_rsa.pub?encoding=base64 }}

---
apiVersion: v1
kind: Secret
metadata:
  name: foldersync-sshkeys-user-001
  namespace: default
type: Opaque
data:
  authorized_keys: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.001.files/id_rsa.pub?encoding=base64 }}
  id_rsa: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.001.files/id_rsa?encoding=base64 }}
  id_rsa.pub: {{ tacet://org/Default/DevOps/Koishi/koishi.foldersync.sshkeys.001.files/id_rsa.pub?encoding=base64 }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foldersync
  namespace: default
  labels:
    app: foldersync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foldersync
  template:
    metadata:
      labels:
        app: foldersync
    spec:
      nodeSelector:
        kubernetes.io/hostname: nur
      volumes:
        - name: foldersync-sshkeys-user-hh
          secret:
            secretName: foldersync-sshkeys-user-hh
            defaultMode: 0600
        - name: foldersync-sshkeys-user-cc
          secret:
            secretName: foldersync-sshkeys-user-cc
            defaultMode: 0600
        - name: foldersync-sshkeys-user-001
          secret:
            secretName: foldersync-sshkeys-user-001
            defaultMode: 0600
        - name: foldersync-sshkeys-system
          secret:
            secretName: foldersync-sshkeys-system
            defaultMode: 0600
        - name: gphoto
          hostPath:
            path: /mnt/user-data-slight/private-data/foldersync/gphoto
            type: Directory
        - name: notebook
          hostPath:
            path: /mnt/coder-workspaces/private-workspace/repos/local/notebook
            type: Directory
      containers:
        - name: app
          image: cloudpublic/default/foldersync:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: foldersync-sshkeys-user-hh
              mountPath: /tmp/foldersync-sshkeys-user-hh
            - name: foldersync-sshkeys-user-cc
              mountPath: /tmp/foldersync-sshkeys-user-cc
            - name: foldersync-sshkeys-user-001
              mountPath: /tmp/foldersync-sshkeys-user-001
            - name: foldersync-sshkeys-system
              mountPath: /tmp/foldersync-sshkeys-system
            - name: gphoto
              mountPath: /data/gphoto
            - name: notebook
              subPath: binder
              mountPath: /data/notebook/binder
            - name: notebook
              subPath: hardback
              mountPath: /data/notebook/hardback
          ports:
            - containerPort: 22
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: foldersync
  namespace: default
  labels:
    app: foldersync
  finalizers:
    - service.kubernetes.io/load-balancer-cleanup
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - port: 37000
      protocol: TCP
      targetPort: 22
  selector:
    app: foldersync
