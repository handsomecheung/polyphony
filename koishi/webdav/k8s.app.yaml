---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sabliercaddywebdav
  namespace: default
spec:
  plugin:
    sablier:
      sablierUrl: "http://sablier.sablier"
      group: "caddy-webdav"
      sessionDuration: "2h"
      blocking:
        timeout: 1m

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: default
data:
  # caddy hash-password
  Caddyfile: |
    {
    	# debug
    	order webdav before file_server
    	auto_https off
    	log {
    		output stderr
    		# level DEBUG
    		format console
    	}
    }

    :80 {
    	handle /ok {
    		respond "OK" 200
    	}

    	route /* {
    		basic_auth {
                {{ tacet://org/Default/DevOps/Koishi/infra.common-users/hh }} {{ tacet://org/Default/DevOps/Koishi/webdav.hh/hash }}
                {{ tacet://org/Default/DevOps/Koishi/infra.common-users/cc }} {{ tacet://org/Default/DevOps/Koishi/webdav.cc/hash }}
                {{ tacet://org/Default/DevOps/Koishi/infra.common-users/hz73 }} {{ tacet://org/Default/DevOps/Koishi/webdav.hz73/hash }}
                hifi {{ tacet://org/Default/DevOps/Koishi/webdav.hifi/hash }}
    		}

    		request_body {
    			max_size 20000MB
    		}

    		webdav {
    			root /data/{http.auth.user.id}
    			prefix /
    		}
    	}
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-webdav
  namespace: default
  labels:
    app.kubernetes.io/name: caddy-webdav
    sablier.enable: "true"
    sablier.group: "caddy-webdav"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy-webdav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy-webdav
    spec:
      nodeSelector:
        kubernetes.io/hostname: nur
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: user-data-slight
          hostPath:
            path: /mnt/user-data-slight
            type: DirectoryOrCreate
        - name: coder-sharepoint
          hostPath:
            path: /mnt/coder-sharepoint
            type: DirectoryOrCreate
        - name: coder-workspaces
          hostPath:
            path: /mnt/coder-workspaces
            type: DirectoryOrCreate
        - name: decrypted
          hostPath:
            path: /mnt/decrypted
            type: DirectoryOrCreate
      containers:
        - name: app
          image: cloudpublic/default/caddy-webdav:latest
          ports:
            - name: default
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
            - name: user-data-slight
              subPath: upload
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/hh }}/user-data-slight/upload
            - name: user-data-slight
              subPath: share-point
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/hh }}/user-data-slight/share-point
            - name: user-data-slight
              subPath: private-data/hero
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/hh }}/user-data-slight/private-data/hero
            - name: user-data-slight
              subPath: private-data/hero-pending
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/hh }}/user-data-slight/private-data/hero-pending
            - name: coder-sharepoint
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/hh }}/coder-sharepoint
            - name: decrypted
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/hh }}/decrypted

            - name: user-data-slight
              subPath: private-data/foldersync/gphoto/cc/pending
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/hh }}/gphoto/cc-pending
            - name: user-data-slight
              subPath: private-data/foldersync/gphoto/cc/sync
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/hh }}/gphoto/cc-sync
            - name: user-data-slight
              subPath: private-data/foldersync/gphoto/hh/from-cc
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/hh }}/gphoto/hh-sync

            - name: coder-workspaces
              subPath: private-workspace/repos/local/mystatic
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/hh }}/repos/local/mystatic

            - name: user-data-slight
              subPath: share-point
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/hz73 }}/share-point

            - name: user-data-slight
              subPath: share-point
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/cc }}/share-point

            - name: coder-workspaces
              subPath: private-workspace/repos/local/mystatic
              mountPath: /data/{{ tacet://org/Default/DevOps/Koishi/infra.common-users/cc }}/repos/mystatic

          resources:
            requests:
              cpu: 50m
              memory: 156Mi
          livenessProbe:
            httpGet:
              path: /ok
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ok
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: caddy-webdav
  namespace: default
  labels:
    app.kubernetes.io/name: caddy-webdav
  annotations:
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: caddy-webdav
  ports:
    - name: default
      port: 80
      protocol: TCP
      targetPort: default

---
# Sets the maximum request body to 20G
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: webdavsizelimit
  namespace: default
spec:
  buffering:
    maxRequestBodyBytes: 20000000000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caddy-webdav
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: cluster-letsencrypt-dns-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: default-webdavsizelimit@kubernetescrd,default-sabliercaddywebdav@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: webdav.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy-webdav
                port:
                  name: default
  tls:
    - hosts:
        - webdav.{{ tacet://org/Default/DevOps/Base/infra-domains/x }}
      secretName: webdav-domainx
